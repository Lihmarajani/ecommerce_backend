name: Keep Backend Awake

on:
  schedule:
    # Runs every 14 minutes
    - cron: '*/14 * * * *'
  # Allow manual triggering
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend
        run: curl -sSf https://ecommerce-backend-n0zn.onrender.com/ > /dev/null
        # -s = silent, -S = show error, -f = fail silently on HTTP errors
